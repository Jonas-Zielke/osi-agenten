<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Einsatzzentrale · OSI-Agenten</title>
<link rel="stylesheet" href="../spiel/css/tokens.css">
<link rel="stylesheet" href="../spiel/css/base.css">
<link rel="stylesheet" href="../spiel/css/components.css">
<link rel="stylesheet" href="../spiel/css/map.css">
<link rel="stylesheet" href="../spiel/css/steps.css">
<link rel="stylesheet" href="zentrale.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff9600'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Arial' font-weight='900' text-anchor='middle' fill='%23fff'%3EE7%3C/text%3E%3C/svg%3E">
<script src="../spiel/js/kit/theme.js"></script>
</head>
<body>
<header id="topbar">
  <span class="tb-logo"><span class="tb-logo-mark">E7</span><span class="tb-logo-text">Einsatzzentrale <span class="muted">· Lehrkraft</span></span></span>
  <span class="spacer"></span><span class="small muted" id="cnt"></span>
  <button class="tb-btn" id="tb-theme" title="Hell/Dunkel umschalten">🌙</button>
</header>
<main id="app" class="zentrale">
  <div id="drop" class="dropzone">
    <b>Spielstand-Dateien (.osiagent) hierher ziehen</b> – beliebig viele auf einmal.<br>
    <span class="small">Oder <a href="#" id="pick">Dateien auswählen</a>. Doppelte Spielstände desselben Duos werden erkannt – der neueste zählt.</span>
    <input type="file" id="file" multiple accept=".osiagent" class="hidden">
    <div class="filelist" id="filelist"></div>
  </div>
  <div class="tabs">
    <button data-tab="karte" class="on">🗺️ Karte</button>
    <button data-tab="beamer">📽️ Beamer</button>
    <button data-tab="duos">👥 Duos <small>(nur Lehrkraft)</small></button>
    <button data-tab="aufgaben">📊 Aufgaben-Analyse <small>(nur Lehrkraft)</small></button>
    <button data-tab="verhoer">🕵️ Abschlussverhör <small>(nur Lehrkraft)</small></button>
    <span class="spacer"></span>
    <button id="csv">⬇ CSV exportieren</button>
    <button id="reset">Liste leeren</button>
  </div>
  <div id="view"></div>
</main>

<script src="../spiel/content/inhalte.js"></script>
<script src="../spiel/js/kit/storage.js"></script>
<script src="../spiel/js/kit/util.js"></script>
<script src="../spiel/js/kit/progress.js"></script>
<script src="../spiel/js/kit/avatars.js"></script>
<script src="../spiel/js/kit/map.js"></script>
<script src="zentrale.js"></script>
</body>
</html>
